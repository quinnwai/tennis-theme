name: test

# Tests only: no secrets, no deploy, nothing that writes to Vercel.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PLAYWRIGHT_BROWSERS_PATH=0 matches the npm scripts: the browser lives inside node_modules.
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
